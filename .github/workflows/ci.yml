name: Build SFL DracFun Reborn

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sfl-dracfun-reborn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Download Slimefun Legacy 4.1.51 API target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl -fL --retry 3 \
            -o libs/Slimefun-Legacy.jar \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.51/Slimefun-Legacy4.1.51.jar
          test -s libs/Slimefun-Legacy.jar

      - name: Verify clean-room source boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^package[[:space:]]+me\.phoenix\.dracfun|me/phoenix/dracfun' src; then
            echo 'Original DracFun package namespace must not be used by this clean-room implementation.' >&2
            exit 1
          fi
          if grep -R -nE 'me\.phoenix\.metrics|org\.bstats' src build.gradle.kts; then
            echo 'Original telemetry/bStats implementation must not be copied into the project.' >&2
            exit 1
          fi

      - name: Verify exact DracFun 2.0.10 runtime IDs
        shell: bash
        run: |
          set -euo pipefail
          # Verified from DracFun 2.0.10 bytecode:
          # ModuleTier.createModule = <family key>_<tier>_MODULE
          # GearType.createItem = DRACFUN_<tier>_<gear type>
          grep -R -Fq 'DRACFUN_AOE_BASIC_MODULE' src/main
          grep -R -Fq 'DRACFUN_POWER_WYVERN_MODULE' src/main
          grep -R -Fq 'DRACFUN_DRACONIC_STAFF_OF_POWER' src/main
          if grep -nE 'DRACFUN_(BASIC|WYVERN|DRACONIC|CHAOTIC)_(AOE|ARROW_DAMAGE|ARROW_GRAVITY|ARROW_IMMUNITY|ARROW_PENETRATION|ARROW_SPEED|DAMAGE|ENERGY|FLIGHT|AUTO_FEED|HARVEST|JUMP|SHIELD_CAPACITY|SHIELD_CONTROL|SHIELD_RECOVERY|SPEED|UNDYING|VISION)_MODULE|DRACFUN_(DRACONIC|CHAOTIC)_STAFF([^_]|$)' \
              src/main/java/io/github/wickidcow/sfdracfun2/compat/LegacyIdentityCatalog.java \
              src/main/resources/legacy-module-recipes.txt \
              src/main/resources/legacy-modular-fusion-recipes.txt; then
            echo 'Found a field-name-derived identifier instead of the original runtime Slimefun ID.' >&2
            exit 1
          fi
          grep -Fq 'return legacyBaseId + '\''_'\'' + tier.legacyName() + "_MODULE";' src/main/java/io/github/wickidcow/sfdracfun2/modular/ModuleFamily.java

      - name: Verify audited modular runtime parity
        shell: bash
        run: |
          set -euo pipefail
          REG=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunModularRegistry.java
          INF=src/main/java/io/github/wickidcow/sfdracfun2/machines/EnergyInfuserMachine.java
          grep -Fq 'case STAFF -> Material.TRIDENT;' "$REG"
          grep -Fq 'Material.NETHERITE_AXE : Material.DIAMOND_AXE' "$REG"
          grep -Fq 'Material.NETHERITE_PICKAXE : Material.DIAMOND_PICKAXE' "$REG"
          grep -Fq 'Material.NETHERITE_SWORD : Material.DIAMOND_SWORD' "$REG"
          grep -Fq 'if (sfItem == null)' "$INF"
          grep -Fq 'if (needed > availableUnits)' "$INF"
          ARM=src/main/java/io/github/wickidcow/sfdracfun2/modular/ModularArmorEffectService.java
          CAP=src/main/java/io/github/wickidcow/sfdracfun2/modular/CapacitorService.java
          grep -Fq 'PASSIVE_EVERY_PASSES = 6' "$ARM"
          grep -Fq 'player.setFlying(true);' "$ARM"
          grep -Fq 'type,' "$ARM"
          grep -Fq '600,' "$ARM"
          grep -Fq 'INITIAL_DELAY_TICKS = 600L' "$CAP"
          grep -Fq 'PERIOD_TICKS = 600L' "$CAP"

      - name: Verify audited Fusion transaction parity
        shell: bash
        run: |
          set -euo pipefail
          FUSION=src/main/java/io/github/wickidcow/sfdracfun2/fusion/FusionCrafterMachine.java
          grep -Fq 'removeCharge(block.getLocation(), recipe.energyCost(), data);' "$FUSION"
          grep -Fq 'menu.consumeItem(input, 1, true);' "$FUSION"
          grep -Fq 'findRecipeByOutput(outputId)' "$FUSION"
          if grep -Fq 'Cancelled: inputs changed' "$FUSION"; then
            echo 'Fusion still uses Reborn reservation/cancellation semantics instead of 2.0.10 commit-at-start behavior.' >&2
            exit 1
          fi

      - name: Verify audited Reactor cycle parity
        shell: bash
        run: |
          set -euo pipefail
          STATE=src/main/java/io/github/wickidcow/sfdracfun2/reactor/ReactorState.java
          REACTOR=src/main/java/io/github/wickidcow/sfdracfun2/reactor/ReactorMachine.java
          grep -Fq 'REBORN_PROGRESS_MIGRATED' "$STATE"
          grep -Fq 'boolean chargedCycle = ReactorState.progress(data) >= 0;' "$REACTOR"
          grep -Fq 'if (!chargedCycle)' "$REACTOR"
          grep -Fq 'ReactorState.bool(data, ReactorState.REBORN_PROGRESS_MIGRATED, true);' "$REACTOR"
          grep -Fq 'ReactorState.progress(data, clampInt(Math.max(1L, reactable) * 120L));' "$REACTOR"

      - name: Verify Guide and Dragon Heart parity
        shell: bash
        run: |
          set -euo pipefail
          MAT=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunMaterialRegistry.java
          HEART=src/main/java/io/github/wickidcow/sfdracfun2/items/DragonHeartItem.java
          COMPAT=src/main/java/io/github/wickidcow/sfdracfun2/compat/LegacyCompatibilityRegistry.java
          grep -Fq 'new LegacyGuideItem(group, guide).register(addon);' "$MAT"
          grep -Fq 'Material.BOOK' "$MAT"
          grep -Fq 'implements NotPlaceable, RandomMobDrop' "$HEART"
          grep -Fq '"dragon-drop-chance", 1, 100, 100' "$HEART"
          grep -Fq 'RecipeType.MOB_DROP' "$HEART"
          if grep -Fq 'GUIDE_ID.equals(id)' "$COMPAT"; then
            echo 'DRACFUN_GUIDE is still excluded from the actual 134-item audit.' >&2
            exit 1
          fi

      - name: Verify Fusion guide visibility
        shell: bash
        run: |
          set -euo pipefail
          GEAR=src/main/java/io/github/wickidcow/sfdracfun2/modular/ModularGearItem.java
          REG=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunModularRegistry.java
          TYPES=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunRecipeTypes.java
          grep -Fq 'DracFunRecipeTypes.fusion(fusionRecipe.tier())' "$REG"
          grep -Fq 'fusionRecipe.toGuideRecipe()' "$REG"
          grep -Fq 'LegacyModularFusionRecipeCatalog.create(hardMode)' "$REG"
          grep -Fq 'LegacyDracFunKeys.key(tier.machineId())' "$TYPES"
          if grep -Fq 'setHidden(true)' "$GEAR"; then
            echo 'Modular gear is still hidden from the Slimefun guide.' >&2
            exit 1
          fi

      - name: Verify Energy Core piece break parity
        shell: bash
        run: |
          set -euo pipefail
          PIECE=src/main/java/io/github/wickidcow/sfdracfun2/energycore/EnergyCorePieceItem.java
          CORE=src/main/java/io/github/wickidcow/sfdracfun2/energycore/EnergyCoreMachine.java
          MAT=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunMaterialRegistry.java
          SHARED=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunSharedProgressionRegistry.java
          REG=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunEnergyCoreRegistry.java
          grep -Fq 'for (int x = -3; x <= 3; x++)' "$PIECE"
          grep -Fq 'for (int y = -7; y <= 0; y++)' "$PIECE"
          grep -Fq 'EnergyCoreMachine.invalidateImmediately(activator)' "$PIECE"
          grep -Fq 'All stored energy has been expelled!' "$PIECE"
          grep -Fq 'static boolean invalidateImmediately(Location location)' "$CORE"
          grep -Fq 'new EnergyCorePieceItem(group, block' "$MAT"
          grep -Fq 'new EnergyCorePieceItem(group, item, type, recipe)' "$SHARED"
          grep -Fq 'new EnergyCorePieceItem(group, stack' "$REG"

      - name: Verify all Fusion outputs have guide recipes
        shell: bash
        run: |
          set -euo pipefail
          CATALOG=src/main/java/io/github/wickidcow/sfdracfun2/fusion/FusionRecipeCatalog.java
          SPEC=src/main/java/io/github/wickidcow/sfdracfun2/fusion/FusionRecipeSpec.java
          SHARED=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunSharedProgressionRegistry.java
          COMPONENTS=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunFusionComponentRegistry.java
          ENERGY=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunEnergyCoreRegistry.java
          GUARDIAN=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunChaosGuardianRegistry.java
          REACTOR=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunReactorRegistry.java

          grep -Fq 'requireByOutput(' "$CATALOG"
          grep -Fq '"DRACFUN_AWAKENED_DRACONIUM_BLOCK".equals(outputId)' "$SPEC"
          grep -Fq 'recipe[1].setAmount(4);' "$SPEC"
          grep -Fq 'registerFusionSimple(' "$SHARED"
          grep -Fq 'registerFusionUnplaceable(' "$COMPONENTS"
          grep -Fq 'chaoticEnergyRecipe.toGuideRecipe()' "$ENERGY"
          grep -Fq 'recipe.toGuideRecipe()' "$GUARDIAN"
          grep -Fq 'registerFusionUnplaceable(addon, machines, energyInjector, hardMode)' "$REACTOR"
          grep -Fq 'registerFusionUnplaceable(addon, machines, stabilizer, hardMode)' "$REACTOR"
          grep -Fq 'registerFusionUnplaceable(addon, machines, reactorCore, hardMode)' "$REACTOR"

          if grep -E 'wyvernInjector|draconicInjector|chaoticInjector|awakenedBlock|awakenedCore|chaoticCore' "$COMPONENTS"               | grep -F 'RecipeType.NULL'; then
            echo 'A Fusion-produced progression component still uses RecipeType.NULL.' >&2
            exit 1
          fi
          if grep -E 'energyInjector|reactorCore' "$REACTOR" | grep -F 'RecipeType.NULL'; then
            echo 'A Fusion-produced reactor component still uses RecipeType.NULL.' >&2
            exit 1
          fi

      - name: Verify Module Integrator removal parity
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/main/java/io/github/wickidcow/sfdracfun2/modular/ModuleIntegratorMachine.java
          grep -Fq 'setSize(54)' "$FILE"
          grep -Fq '37, 38, 39, 40, 41, 42, 43' "$FILE"
          grep -Fq '46, 47, 48, 49, 50, 51, 52' "$FILE"
          grep -Fq 'Empty all module-return output slots before removing modules.' "$FILE"
          grep -Fq 'menu.replaceExistingItem(MODULE_OUTPUTS[i], stack);' "$FILE"
          if grep -Fq 'player.getInventory().addItem' "$FILE"; then
            echo 'Module removal still bypasses the original machine output slots.' >&2
            exit 1
          fi

      - name: Verify original modular lore parity
        shell: bash
        run: |
          set -euo pipefail
          LORE=src/main/java/io/github/wickidcow/sfdracfun2/modular/LegacyModularLore.java
          LIVE=src/main/java/io/github/wickidcow/sfdracfun2/modular/ModularLore.java
          REG=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunModularRegistry.java
          grep -Fq '"Arrow Immunity"' "$LORE"
          grep -Fq '"Flight Boost"' "$LORE"
          grep -Fq '"Shield Recharge Rate"' "$LORE"
          grep -Fq '"Module Size"' "$LORE"
          grep -Fq '"Gear Type"' "$LORE"
          grep -Fq '" QS"' "$LORE"
          grep -Fq 'LegacyModularLore.liveGearLore(stack, gear)' "$LIVE"
          grep -Fq 'LegacyModularLore.defaultGearLore(type, tier)' "$REG"
          grep -Fq 'LegacyModularLore.moduleLore(family, tier)' "$REG"
          if grep -Fq 'DracFun Reborn compatibility module' "$REG"; then
            echo 'Generic Reborn modular lore returned.' >&2
            exit 1
          fi

      - name: Verify original item theme parity
        shell: bash
        run: |
          set -euo pipefail
          THEME=src/main/java/io/github/wickidcow/sfdracfun2/compat/LegacyTheme.java
          grep -Fq 'ORE("#C0C0C0", "Ore Resource")' "$THEME"
          grep -Fq 'BASIC_CRAFTING("#800080", "Basic Crafting Component")' "$THEME"
          grep -Fq 'ADVANCED_CRAFTING("#FFA500", "Advanced Crafting Component")' "$THEME"
          grep -Fq 'END_GAME_CRAFTING("#333333", "End-Game Crafting Component")' "$THEME"
          grep -Fq 'ENERGY_CORE("#FF0000", "Energy Core Component")' "$THEME"
          grep -Fq 'FUSION_CRAFTING("#40E0D0", "Fusion Crafting Component")' "$THEME"
          grep -Fq 'MACHINE("#FFFF00", "Electric Machine")' "$THEME"
          grep -Fq 'MOB("#3A3B3C", "Mob Drop")' "$THEME"
          grep -Fq 'REACTOR("#FFA500", "Draconic Reactor Part")' "$THEME"
          grep -Fq 'LegacyTheme.ORE.stack' src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunMaterialRegistry.java
          grep -Fq 'LegacyTheme.FUSION_CRAFTING.stack' src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunFusionComponentRegistry.java
          grep -Fq 'LegacyTheme.ENERGY_CORE.stack' src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunEnergyCoreRegistry.java
          grep -Fq 'LegacyTheme.REACTOR.stack' src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunReactorRegistry.java

      - name: Verify original machine UI parity
        shell: bash
        run: |
          set -euo pipefail
          FUSION=src/main/java/io/github/wickidcow/sfdracfun2/fusion/FusionCrafterMachine.java
          INFUSER=src/main/java/io/github/wickidcow/sfdracfun2/machines/EnergyInfuserMachine.java
          CONVERTER=src/main/java/io/github/wickidcow/sfdracfun2/machines/ItemConverterMachine.java
          grep -Fq 'private static final int[] INPUTS = {10, 13, 16, 19, 25, 28, 34, 37, 43};' "$FUSION"
          grep -Fq 'private static final int STATUS = 31;' "$FUSION"
          grep -Fq 'private static final int OUTPUT = 40;' "$FUSION"
          grep -Fq 'setSize(54)' "$FUSION"
          grep -Fq 'Click To Start Fusion Crafting!' "$FUSION"
          grep -Fq 'You may not start another fusion as output slot is occupied!' "$FUSION"
          grep -Fq 'Invalid recipe!' "$FUSION"
          grep -Fq 'This Fusion Craft requires a minimum of ' "$FUSION"
          grep -Fq 'private static final int INPUT = 10;' "$INFUSER"
          grep -Fq 'private static final int STATUS = 13;' "$INFUSER"
          grep -Fq 'private static final int OUTPUT = 16;' "$INFUSER"
          grep -Fq 'Current Power' "$INFUSER"
          grep -Fq 'Click to update your old DracFun Items!' "$CONVERTER"
          grep -Fq 'Make sure to enter plain item ONLY!' "$CONVERTER"
          grep -Fq 'Remove all the enchant and stuff before updating!' "$CONVERTER"

      - name: Verify original DracFun guide presentation
        shell: bash
        run: |
          set -euo pipefail
          GUIDE=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunItemGroups.java
          grep -Fq 'Material.NETHERITE_INGOT' "$GUIDE"
          grep -Fq 'DracFun Materials' "$GUIDE"
          grep -Fq 'Material.BEACON' "$GUIDE"
          grep -Fq 'DracFun Energy Core' "$GUIDE"
          grep -Fq 'Material.IRON_CHESTPLATE' "$GUIDE"
          grep -Fq 'Wyvern Gear' "$GUIDE"
          grep -Fq 'Draconic Gear' "$GUIDE"
          grep -Fq 'Material.NETHER_STAR' "$GUIDE"
          grep -Fq 'Chaotic Gear' "$GUIDE"
          grep -Fq 'DracFun Modules' "$GUIDE"
          grep -Fq 'Material.REDSTONE_TORCH' "$GUIDE"
          grep -Fq 'DracFun Electric' "$GUIDE"
          grep -Fq 'Material.RESPAWN_ANCHOR' "$GUIDE"
          grep -Fq 'Draconic Reactor' "$GUIDE"

      - name: Verify original modular registration themes
        shell: bash
        run: |
          set -euo pipefail
          REG=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunModularRegistry.java
          grep -Fq 'LegacyTheme.BASIC_MODULAR.stack' "$REG"
          grep -Fq 'tierName(tier) + " Modular " + displayName(type)' "$REG"
          grep -Fq 'case BASIC -> Material.MUSIC_DISC_WAIT;' "$REG"
          grep -Fq 'case WYVERN -> Material.MUSIC_DISC_MALL;' "$REG"
          grep -Fq 'case DRACONIC -> Material.MUSIC_DISC_13;' "$REG"
          grep -Fq 'case CHAOTIC -> Material.MUSIC_DISC_STAL;' "$REG"
          grep -Fq 'case 1 -> LegacyTheme.WYVERN_MODULAR;' "$REG"
          grep -Fq 'case 2 -> LegacyTheme.DRACONIC_MODULAR;' "$REG"
          grep -Fq 'case 3 -> LegacyTheme.CHAOTIC_MODULAR;' "$REG"
          grep -Fq 'Material.LODESTONE' "$REG"
          grep -Fq '"Module Integrater"' "$REG"

      - name: Verify machine items and Chaos Orb metadata
        shell: bash
        run: |
          set -euo pipefail
          MACH=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunMachineRegistry.java
          ORB=src/main/java/io/github/wickidcow/sfdracfun2/setup/DracFunChaosGuardianRegistry.java
          grep -Fq 'Material.DAYLIGHT_DETECTOR' "$MACH"
          grep -Fq 'LoreBuilder.powerBuffer(EnergyInfuserMachine.ENERGY_CAPACITY)' "$MACH"
          grep -Fq 'Material.LODESTONE' "$MACH"
          grep -Fq 'Material.LIGHT_BLUE_GLAZED_TERRACOTTA' "$MACH"
          grep -Fq 'Material.PURPLE_GLAZED_TERRACOTTA' "$MACH"
          grep -Fq 'Material.ORANGE_GLAZED_TERRACOTTA' "$MACH"
          grep -Fq 'Material.BLACK_GLAZED_TERRACOTTA' "$MACH"
          grep -Fq 'LegacyTheme.FUSION_CRAFTING.stack' "$MACH"
          grep -Fq '2_147_483_646' "$ORB"
          grep -Fq 'LegacyDracFunKeys.FUSION_POWER' "$ORB"

      - name: Verify Paper 1.21.11 baseline
        run: gradle clean shadowJar -Pplatform=paper -PplatformVersion=1.21.11-R0.1-SNAPSHOT -PreleaseJvm=21 --stacktrace --no-daemon

      - name: Verify Paper 26.2 compilation
        run: gradle clean compileJava -Pplatform=paper -PplatformVersion=26.2.build.+ -PreleaseJvm=25 --stacktrace --no-daemon

      - name: Verify Purpur 26.2 compilation
        run: gradle clean compileJava -Pplatform=purpur -PplatformVersion=26.2.build.+ -PreleaseJvm=25 --stacktrace --no-daemon

      - name: Verify Paper 26.3 compilation
        run: gradle clean compileJava -Pplatform=paper -PplatformVersion=26.3.build.+ -PreleaseJvm=25 --stacktrace --no-daemon

      - name: Verify Purpur 26.3 when published
        shell: bash
        run: |
          set -euo pipefail
          METADATA_URL="https://repo.purpurmc.org/snapshots/org/purpurmc/purpur/purpur-api/maven-metadata.xml"
          if curl -fsSL "$METADATA_URL" | grep -q '<version>26\.3\.build\.'; then
            gradle clean compileJava -Pplatform=purpur -PplatformVersion=26.3.build.+ -PreleaseJvm=25 --stacktrace --no-daemon
          else
            echo 'Purpur 26.3 API not published yet; skipping until available.'
          fi

      - name: Verify Folia 26.2 compilation
        run: gradle clean compileJava -Pplatform=folia -PplatformVersion=26.2.build.+ -PreleaseJvm=25 --stacktrace --no-daemon

      - name: Build universal release JAR
        run: gradle clean shadowJar -Pplatform=paper -PplatformVersion=1.21.11-R0.1-SNAPSHOT -PreleaseJvm=21 --stacktrace --no-daemon

      - name: Runtime smoke on Paper 26.2
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$RUNNER_TEMP/dracfun-paper-smoke"
          mkdir -p "$SMOKE_DIR/plugins"
          cp build/libs/SFL_DracFun-Reborn2.0.1.jar "$SMOKE_DIR/plugins/"
          cp libs/Slimefun-Legacy.jar "$SMOKE_DIR/plugins/Slimefun-Legacy4.1.51.jar"

          PAPER_URL=$(curl -fsSL --retry 3 \
            -H 'User-Agent: SF_DracFun2-CI/2.0.1 (https://github.com/wickidcow/SF_DracFun2)' \
            https://fill.papermc.io/v3/projects/paper/versions/26.2/builds \
            | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')
          test -n "$PAPER_URL"
          curl -fL --retry 3 \
            -H 'User-Agent: SF_DracFun2-CI/2.0.1 (https://github.com/wickidcow/SF_DracFun2)' \
            "$PAPER_URL" -o "$SMOKE_DIR/paper.jar"

          printf 'eula=true\n' > "$SMOKE_DIR/eula.txt"
          cat > "$SMOKE_DIR/server.properties" <<'EOF'
          online-mode=false
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          enable-query=false
          enable-rcon=false
          level-name=dracfun_smoke
          EOF

          (
            cd "$SMOKE_DIR"
            java -Xms512M -Xmx1024M -jar paper.jar --nogui > server.log 2>&1 &
            echo $! > server.pid
          )

          PID=$(cat "$SMOKE_DIR/server.pid")
          STARTED=false
          for _ in $(seq 1 120); do
            if grep -Fq 'Done (' "$SMOKE_DIR/server.log"; then
              STARTED=true
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'Paper exited before completing startup.' >&2
              cat "$SMOKE_DIR/server.log"
              exit 1
            fi
            sleep 1
          done

          if [ "$STARTED" != true ]; then
            echo 'Paper did not finish startup within the smoke-test window.' >&2
            cat "$SMOKE_DIR/server.log"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi

          grep -Fq 'SF_DracFun2 clean-room compatibility layer starting.' "$SMOKE_DIR/server.log"
          grep -Fq 'Legacy identity runtime audit: 134/134 accounted for (133 non-placeholder items, 1 placeholders, guide category present); migration aliases 3/3 registered.' "$SMOKE_DIR/server.log"
          if grep -Fq 'Complete-restoration audit expected' "$SMOKE_DIR/server.log"; then
            echo 'DracFun complete-restoration runtime audit failed.' >&2
            cat "$SMOKE_DIR/server.log"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          if grep -Eq 'Error occurred while enabling SF_DracFun2|Could not load .*SF_DracFun|\[SF_DracFun2\].*SEVERE' "$SMOKE_DIR/server.log"; then
            echo 'DracFun emitted an enable-time error.' >&2
            cat "$SMOKE_DIR/server.log"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          tail -n 120 "$SMOKE_DIR/server.log"

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/SFL_DracFun-Reborn2.0.1.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml > build/plugin.yml
          grep -Eq '^api-version:.*1\.21\.11' build/plugin.yml
          grep -Eq '^folia-supported:[[:space:]]*true' build/plugin.yml
          grep -Eq '^version:.*2\.0\.1' build/plugin.yml
          unzip -p "$JAR" config.yml > build/config.yml
          for feature in materials end-resource energy-infuser item-converter fusion-crafting modular-gear energy-core reactor chaos-guardian; do
            grep -Eq "^[[:space:]]{2}${feature}:[[:space:]]*true[[:space:]]*$" build/config.yml
          done
          if unzip -l "$JAR" | grep -Eq 'me/phoenix/(dracfun|metrics)/'; then
            echo 'Original DracFun implementation classes leaked into the clean-room artifact.' >&2
            exit 1
          fi
          javap -verbose -classpath "$JAR" io.github.wickidcow.sfdracfun2.SFDracFun2 | grep -Fq 'major version: 65'
          sha256sum "$JAR"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: SFL_DracFun-Reborn2.0.1.jar
          path: build/libs/SFL_DracFun-Reborn2.0.1.jar
          archive: false
          if-no-files-found: error
