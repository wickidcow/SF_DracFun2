      - name: Runtime smoke on Paper 26.2
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$RUNNER_TEMP/dracfun-paper-smoke"
          mkdir -p "$SMOKE_DIR/plugins"
          cp build/libs/SFL_DracFun-Reborn2.0.4.jar "$SMOKE_DIR/plugins/"
          cp libs/Slimefun-Legacy.jar "$SMOKE_DIR/plugins/Slimefun-Legacy4.1.51.jar"

          # Reproduce the staged-development config that left upgraded servers
          # with only the Guide + five basic Draconium materials visible.
          mkdir -p "$SMOKE_DIR/plugins/SF_DracFun2"
          cat > "$SMOKE_DIR/plugins/SF_DracFun2/config.yml" <<'EOF'
          options:
            hard-mode: true
            use-dragon-egg: true
          compatibility:
            preserve-legacy-ids: true
          reactor:
            explosion-multiplier: 0.25
            explosion-power-cap: 64.0
            break-explosion-power: 4.0
            meltdown-explosion-enabled: true
          guardian:
            crystal-cages-enabled: true
            punish-unarmored: true
            laser-damage-cap: 5000.0
            wither-minion-lifetime-ticks: 200
          features:
            materials: true
            end-resource: true
            energy-infuser: false
            item-converter: false
            fusion-crafting: false
            modular-gear: false
            energy-core: false
            reactor: false
            chaos-guardian: false
          EOF

          PAPER_URL=$(curl -fsSL --retry 3 \
            -H 'User-Agent: SF_DracFun2-CI/2.0.4 (https://github.com/wickidcow/SF_DracFun2)' \
            https://fill.papermc.io/v3/projects/paper/versions/26.2/builds \
            | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')
          test -n "$PAPER_URL"
          curl -fL --retry 3 \
            -H 'User-Agent: SF_DracFun2-CI/2.0.4 (https://github.com/wickidcow/SF_DracFun2)' \
            "$PAPER_URL" -o "$SMOKE_DIR/paper.jar"

          printf 'eula=true\n' > "$SMOKE_DIR/eula.txt"
          cat > "$SMOKE_DIR/server.properties" <<'EOF'
          online-mode=false
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          enable-query=false
          enable-rcon=false
          level-name=dracfun_smoke
          EOF

          (
            cd "$SMOKE_DIR"
            java -Xms512M -Xmx1024M -jar paper.jar --nogui > server.log 2>&1 &
            echo $! > server.pid
          )

          PID=$(cat "$SMOKE_DIR/server.pid")
          STARTED=false
          for _ in $(seq 1 120); do
            if grep -Fq 'Done (' "$SMOKE_DIR/server.log"; then
              STARTED=true
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'Paper exited before completing startup.' >&2
              cat "$SMOKE_DIR/server.log"
              exit 1
            fi
            sleep 1
          done

          if [ "$STARTED" != true ]; then
            echo 'Paper did not finish startup within the smoke-test window.' >&2
            cat "$SMOKE_DIR/server.log"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi

          grep -Fq 'SF_DracFun2 clean-room compatibility layer starting.' "$SMOKE_DIR/server.log"
          grep -Fq 'Migrated pre-completion DracFun Reborn config defaults' "$SMOKE_DIR/server.log"
          grep -Fq 'Legacy identity runtime audit: 134/134 accounted for (133 non-placeholder items, 1 placeholders, guide category present); migration aliases 3/3 registered.' "$SMOKE_DIR/server.log"
          grep -Eq '^config-version:[[:space:]]*1[[:space:]]*$' "$SMOKE_DIR/plugins/SF_DracFun2/config.yml"
          for feature in energy-infuser item-converter fusion-crafting modular-gear energy-core reactor chaos-guardian; do
            grep -Eq "^[[:space:]]{2}${feature}:[[:space:]]*true[[:space:]]*$" "$SMOKE_DIR/plugins/SF_DracFun2/config.yml"
          done
          if grep -Fq 'Complete-restoration audit expected' "$SMOKE_DIR/server.log"; then
            echo 'DracFun complete-restoration runtime audit failed.' >&2
            cat "$SMOKE_DIR/server.log"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          if grep -Eq 'Error occurred while enabling SF_DracFun2|Could not load .*SF_DracFun|\[SF_DracFun2\].*SEVERE' "$SMOKE_DIR/server.log"; then
            echo 'DracFun emitted an enable-time error.' >&2
            cat "$SMOKE_DIR/server.log"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          tail -n 120 "$SMOKE_DIR/server.log"

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/SFL_DracFun-Reborn2.0.4.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml > build/plugin.yml
          grep -Eq '^api-version:.*1\.21\.11' build/plugin.yml
          grep -Eq '^folia-supported:[[:space:]]*true' build/plugin.yml
          grep -Eq '^version:.*2\.0\.3' build/plugin.yml
          unzip -p "$JAR" config.yml > build/config.yml
          grep -Eq '^config-version:[[:space:]]*1[[:space:]]*$' build/config.yml
          for feature in materials end-resource energy-infuser item-converter fusion-crafting modular-gear energy-core reactor chaos-guardian; do
            grep -Eq "^[[:space:]]{2}${feature}:[[:space:]]*true[[:space:]]*$" build/config.yml
          done
          grep -Eq '^[[:space:]]{2}fix-broken-arrow-penetration:[[:space:]]*false[[:space:]]*$' build/config.yml
          if grep -Fq 'DracFun Reborn 2.0.1' build/config.yml; then
            echo 'Stale 2.0.1 branding remains in packaged 2.0.4 config.' >&2
            exit 1
          fi
          if unzip -l "$JAR" | grep -Eq 'me/phoenix/(dracfun|metrics)/'; then
            echo 'Original DracFun implementation classes leaked into the clean-room artifact.' >&2
            exit 1
          fi
          javap -verbose -classpath "$JAR" io.github.wickidcow.sfdracfun2.SFDracFun2 | grep -Fq 'major version: 65'
          sha256sum "$JAR"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: SFL_DracFun-Reborn2.0.4.jar
          path: build/libs/SFL_DracFun-Reborn2.0.4.jar
          archive: false
          if-no-files-found: error

