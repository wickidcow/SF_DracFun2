options:
  # Legacy DracFun setting retained for migration compatibility.
  hard-mode: true

  # Legacy DracFun setting retained for migration compatibility.
  # true = use the vanilla Dragon Egg where the restored recipe/system allows it.
  use-dragon-egg: true

compatibility:
  # Keep observable DRACFUN_* identities when restored systems register items/data.
  preserve-legacy-ids: true

reactor:
  # DracFun 2.0.10 used 0.25 by default for meltdown scaling.

  # Reborn caps extreme fuel-scaled explosions to protect server stability.
  explosion-power-cap: 64.0

  # Legacy active-reactor break explosion was power 4 (valid range 0-10).
  # Set to 0 to disable the break explosion while testing.

  # When false, a failed reactor stays in STATE_BEYOND_HOPE instead of exploding.
  meltdown-explosion-enabled: true

guardian:
  # Preserve the old caged healing-crystal mechanic.
  crystal-cages-enabled: true

  # DracFun 2.0.10 left its iron-bar/obsidian crystal cages behind.
  # Set true only if you prefer Reborn's safer post-fight cleanup behavior.
  cleanup-crystal-cages: false

  # The original battle killed nearby unarmored players when the Guardian died.
  punish-unarmored: true

  # Old laser pulses reached 5,000 damage at the end of the attack sequence.
  laser-damage-cap: 5000.0

  # DracFun 2.0.10 did not force-remove summoned Guardian Withers.
  # Set a positive tick value only if you want Reborn's cleanup override.
  wither-minion-lifetime-ticks: 0

features:
  # DracFun Reborn 2.0.1 ships the completed restoration enabled on fresh installs.
  # Every subsystem remains independently toggleable for staged rollouts or testing.
  materials: true
  end-resource: true
  energy-infuser: true
  item-converter: true
  fusion-crafting: true
  modular-gear: true
  energy-core: true
  reactor: true
  chaos-guardian: true
